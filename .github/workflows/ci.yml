name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 3

  # Accessibility gate: runs the repo-vendored axe scan (scripts/a11y-gate.mjs)
  # against the built app and FAILS on any WCAG 2.2 A/AA violation.
  # /before/* routes are excluded by config — they are the intentionally
  # inaccessible demonstration variant (see docs/SPEC.md).
  # NOTE: job lands together with scripts/a11y-gate.mjs (A11Y-2); until that
  # commit this job is absent rather than green-by-default.
